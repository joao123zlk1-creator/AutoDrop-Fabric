
name: Compilar Auto Drop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Extrair projeto
        run: unzip autodrop-fabric-source.zip -d source

      - name: Corrigir ação de inventário
        run: |
          FILE=source/AutoDrop-Fabric-26.1.2/src/main/java/br/autodrop/AutoDropController.java
          sed -i 's/import net.minecraft.world.inventory.ClickType;/import net.minecraft.world.inventory.SlotActionType;/' "$FILE"
          sed -i 's/ClickType.THROW/SlotActionType.THROW/' "$FILE"

      - name: Compilar
        working-directory: source/AutoDrop-Fabric-26.1.2
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDrop-JAR
          path: source/AutoDrop-Fabric-26.1.2/build/libs/*.jar
